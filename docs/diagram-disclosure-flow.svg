<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Disclosure and proof flow with proof-before-date">
<title>Disclosure / Proof Flow — Proof Before Date</title>
<rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
<text x="30" y="36" font-size="20" font-weight="bold" fill="#111">Disclosure / Proof Flow — Proof Before Date (I2)</text>
<text x="30" y="58" font-size="11" fill="#444">FACT: SD-JWT selective disclosure RFC 9901 (S5) · FACT: inclusion + consistency proofs RFC 9162 (S2) · Leo I2/I3/I4/I5/I9</text>
<style>
.box{fill:#fff;stroke:#111;stroke-width:1.6}
.log{fill:#eef7ee;stroke:#0E7A3D;stroke-width:1.6}
.chn{fill:#eef3fb;stroke:#1D4ED8;stroke-width:1.6}
.warn{fill:#fff8e6;stroke:#8A5A00;stroke-width:1.6}
.t{font-size:12px;font-weight:bold;fill:#111}
.s{font-size:10px;fill:#333}
.cap{font-size:10px;font-weight:bold;fill:#111}
.ln{stroke:#111;stroke-width:1.6;fill:none}
.gln{stroke:#0E7A3D;stroke-width:1.6;fill:none}
.bln{stroke:#1D4ED8;stroke-width:1.6;stroke-dasharray:5 3;fill:none}
</style>

<!-- two lanes -->
<rect x="20" y="80" width="960" height="34" fill="#0E7A3D"/>
<text x="34" y="102" font-size="11" font-weight="bold" fill="#fff">LOG LANE — hashes, signatures, STHs only. Plaintext never enters this lane (I3).</text>
<rect x="20" y="380" width="960" height="34" fill="#1D4ED8"/>
<text x="34" y="402" font-size="11" font-weight="bold" fill="#fff">CHANNEL LANE — ciphertext and plaintext live here only. Nothing in this lane is trusted without the LOG lane.</text>

<!-- log lane steps -->
<rect class="log" x="40" y="130" width="150" height="80" rx="6"/>
<text class="t" x="52" y="152">1 · Submit</text>
<text class="s" x="52" y="168">payload_hash +</text>
<text class="s" x="52" y="182">DSSE envelope +</text>
<text class="s" x="52" y="196">issuer id</text>

<rect class="log" x="230" y="130" width="150" height="80" rx="6"/>
<text class="t" x="242" y="152">2 · Log STH</text>
<text class="s" x="242" y="168">tree size N · root</text>
<text class="s" x="242" y="182">timestamp (log time)</text>
<text class="s" x="242" y="196">signature</text>

<rect class="log" x="420" y="130" width="150" height="80" rx="6"/>
<text class="t" x="432" y="152">3 · Witnesses</text>
<text class="s" x="432" y="168">W1 mirror chain</text>
<text class="s" x="432" y="182">W2 monitor</text>
<text class="s" x="432" y="196">countersignatures</text>

<rect class="box" x="610" y="130" width="170" height="80" rx="6"/>
<text class="t" x="622" y="152">4 · Verify (I5)</text>
<text class="s" x="622" y="168">recompute inclusion</text>
<text class="s" x="622" y="182">+ consistency proofs</text>
<text class="s" x="622" y="196">client-side, offline OK</text>

<!-- verdict fork -->
<rect x="820" y="130" width="140" height="26" fill="#0E7A3D" rx="4"/>
<text x="830" y="147" font-size="11" font-weight="bold" fill="#fff">VERIFIED</text>
<rect x="820" y="162" width="140" height="26" fill="#B3261E" rx="4"/>
<text x="830" y="179" font-size="11" font-weight="bold" fill="#fff">REJECTED</text>
<rect x="820" y="194" width="140" height="26" fill="#fff" stroke="#8A5A00" stroke-width="1.6" rx="4"/>
<text x="826" y="211" font-size="9" font-weight="bold" fill="#8A5A00">UNVERIFIED (STH…)</text>

<path class="gln" d="M190 170 H230"/><path d="M230 170 l-8 -4 v8 z" fill="#0E7A3D"/>
<path class="gln" d="M380 170 H420"/><path d="M420 170 l-8 -4 v8 z" fill="#0E7A3D"/>
<path class="gln" d="M570 170 H610"/><path d="M610 170 l-8 -4 v8 z" fill="#111"/>
<path class="ln" d="M780 155 C800 155 805 143 820 143"/>
<path class="ln" d="M780 170 H820"/>
<path class="ln" d="M780 185 C800 185 805 207 820 207"/>

<!-- timeline proof-before-date -->
<text class="cap" x="40" y="250">PROOF-BEFORE-DATE TIMELINE (I2): existence is proven at the STH tick; any earlier claimed date is assertion.</text>
<line x1="40" y1="290" x2="960" y2="290" stroke="#111" stroke-width="2"/>
<line x1="200" y1="280" x2="200" y2="300" stroke="#999" stroke-width="2"/>
<text class="s" x="130" y="318">author claims issued_at</text>
<text class="s" x="150" y="330">(unverified assertion)</text>
<line x1="560" y1="276" x2="560" y2="304" stroke="#0E7A3D" stroke-width="4"/>
<rect x="480" y="336" width="160" height="26" fill="#0E7A3D" rx="4"/>
<text x="492" y="353" font-size="11" font-weight="bold" fill="#fff">PROOF: STH time, size N</text>
<text class="s" x="660" y="296">proven region (at or before STH)</text>
<text class="s" x="660" y="310">backdating impossible past this tick;</text>
<text class="s" x="660" y="324">late issued_at is detectable, early is not</text>
<text class="s" x="660" y="338">— say so in copy (Frida §3)</text>
<rect x="60" y="336" width="280" height="26" fill="#fff" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3" rx="4"/>
<text x="72" y="353" font-size="11" fill="#666">unproven region (claim only)</text>

<!-- channel lane steps: three tiers -->
<rect class="chn" x="40" y="430" width="280" height="120" rx="6"/>
<text class="t" x="52" y="452">PUBLIC tier (I4)</text>
<text class="s" x="52" y="468">content published openly</text>
<text class="s" x="52" y="482">log holds hash of artifact</text>
<text class="s" x="52" y="496">verify: hash(published) == log</text>
<text class="s" x="52" y="510">no reveal step needed</text>
<text class="s" x="52" y="524">SD-JWT: not required</text>

<rect class="chn" x="350" y="430" width="290" height="120" rx="6"/>
<text class="t" x="362" y="452">GROUP tier (I4)</text>
<text class="s" x="362" y="468">ciphertext; key to group off-log</text>
<text class="s" x="362" y="482">log holds SHA-256(ciphertext)</text>
<text class="s" x="362" y="496">reveal: hand over ciphertext,</text>
<text class="s" x="362" y="510">verifier hash-matches (T8)</text>
<text class="s" x="362" y="524">SD-JWT: claim subset optional</text>

<rect class="chn" x="670" y="430" width="290" height="120" rx="6"/>
<text class="t" x="682" y="452">PERSON tier (I4)</text>
<text class="s" x="682" y="468">ciphertext; key sealed to one</text>
<text class="s" x="682" y="482">log holds SHA-256(ciphertext)</text>
<text class="s" x="682" y="496">reveal: recipient discloses;</text>
<text class="s" x="682" y="510">SD-JWT per-claim chips (T8),</text>
<text class="s" x="682" y="524">withheld rows shown redacted</text>

<path class="bln" d="M495 410 V130"/>
<text class="s" x="505" y="280">only the hash crosses lanes</text>

<!-- assumption bar + scribe -->
<rect class="warn" x="40" y="570" width="920" height="60" rx="6"/>
<text class="cap" x="52" y="592">EVERY VERDICT CARRIES ASSUMPTIONS (I9) + SCRIBE NOTE (I7)</text>
<text class="s" x="52" y="608">log endpoint · tree size · witness set + corroboration · key epoch + grace position · verifier build hash — "Verified means this hash is in this log at this size; witnesses agree; key was valid then. Nothing more."</text>
<text class="s" x="52" y="622">Scribe-mediated records badged "via scribe id" — scribe submits hashes only; can delay, cannot forge or read plaintext.</text>

<text x="40" y="660" font-size="10" fill="#333">RECOMMENDATION: two-lane UI — no control moves content from CHANNEL to LOG. ASSUMPTION: verifier exposes proof/STH/witness/key-epoch separately (else layout unimplementable).</text>
<text x="40" y="678" font-size="10" fill="#333">OPEN: offline-bundle staleness window (proposal 7 days renders UNVERIFIED — STALE, never VERIFIED).</text>
</svg>